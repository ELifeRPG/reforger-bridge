name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    # Same image as .devcontainer/Dockerfile's base — pins the preview SDK/runtime
    # from global.json without needing a devcontainer/compose build in CI.
    container: mcr.microsoft.com/devcontainers/dotnet:2.1.4-11.0-preview

    permissions:
      contents: read
      packages: read

    steps:
      - uses: actions/checkout@v4

      # Credentials stay out of the committed NuGet.config, so the devcontainer's mounted
      # ~/.nuget isn't overridden by it. CI injects its own into the checked-out copy.
      - name: Authenticate to GitHub Packages
        run: >
          dotnet nuget update source eliferpg-github
          --username ${{ github.actor }}
          --password ${{ secrets.GITHUB_TOKEN }}
          --store-password-in-clear-text
          --configfile NuGet.config

      - name: Restore
        run: dotnet restore ELifeRPG.Bridge.slnx

      - name: Build
        run: dotnet build ELifeRPG.Bridge.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test ELifeRPG.Bridge.slnx --no-build --configuration Release
